<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2efe9" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme')
          const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>Olubayo Wisdom | Software Engineer</title>
    <meta name="description" content="Portfolio of Olubayo Wisdom, a software engineer building products and platforms: AWS infrastructure, delivery pipelines, scalable backend systems and analytics platforms." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
